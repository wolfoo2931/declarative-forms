<html>

        <script type="text/javascript" src="./declarativ_form.packaged.js"></script>
        <link href="./default.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css?family=Rubik:300,500" rel="stylesheet">
    </head>

    <body>

    </body>

    <script>

        var form;

        document.addEventListener("DOMContentLoaded", function(event) {
            var DeclarativForm = require('/src/declarativ_form.js')

            attr = {
                fields: [
                    {
                        name: 'language',
                        displayName: 'Syntax Highlighting for a ... long long long long long long long long long long long name',
                        message: 'this is the message',
                        allowedValues: ["XML", "HTML", "MathML", "SVG", "CSS", "clike", "JavaScript"],
                        defaultValue: 'JavaScript',
                        tab: 'General Settings'
                    },
                    {
                        name: 'note',
                        displayName: 'Your Note',
                        largetext: true,
                        allowNewlines: true,
                        defaultValue: 'A longer text',
                        tab: 'Special'
                    }
                ]
            }

            form = new DeclarativForm(attr, () => {}, () => {})
            form.openInModal()
        });

    </script>

name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) and provenance.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1. Pin the major: `npm@latest` is
      # npm 12, which refuses to install on anything below Node 22.22/24.15.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      # package.json is the source of truth for what gets published, so a
      # release tag that disagrees with it is a mistake. Catch it here rather
      # than at `npm publish`, which only fails after provenance has already
      # been written to the public transparency log.
      - name: Verify release tag matches package.json
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${RELEASE_TAG#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$version'. Bump the version, commit, and re-tag."
            exit 1
          fi

      # Prerelease versions (2.0.0-alpha.0) must not land on the `latest`
      # dist-tag, so derive the tag from the version in package.json.
      - name: Determine dist-tag
        id: disttag
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            tag="${version#*-}"   # 2.0.0-alpha.0 -> alpha.0
            tag="${tag%%.*}"      # alpha.0       -> alpha
          else
            tag="latest"
          fi
          echo "Publishing $version under dist-tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # prepublishOnly runs typecheck + tests + build.
      - name: Publish to npm
        run: npm publish --access public --provenance --tag ${{ steps.disttag.outputs.tag }}

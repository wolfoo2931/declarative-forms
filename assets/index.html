<html>
    <head>
        <script type="text/javascript" src="./declarativ_form.packaged.js"></script>
        <script type="text/javascript" src="../src/dl_select.js"></script>
        <link href="./default.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css?family=Rubik:300" rel="stylesheet">

        <style>
            #form-container {
                font-family: Rubik;
                margin: auto;
                width: 500px;
            }

            #form-container label {
                display: block;
                margin-bottom: 5px;
                margin-left: 3px;
                font-size: 0.9em;
                color: #888;
            }
        </style>
    </head>

    <body>
        <div id="form-container"></div>

    </body>

    <script>

        document.addEventListener("DOMContentLoaded", function(event) {
            var DeclarativForm = require('/src/declarativ_form.js')

            var container = document.getElementById('form-container')

            attr = {
                fields: [
                    {
                      name: 'language',
                      displayName: 'Syntax Highlighting for',
                      allowedValues: ["XML", "HTML", "MathML", "SVG", "CSS", "clike", "JavaScript"]
                    }
                ]
            }

            var form = new DeclarativForm(attr)

            container.innerHTML = form.getHTML()
        });

    </script>
</html>

<html>
    <head>
        <script type="text/javascript" src="./declarativ_form.packaged.js"></script>
        <script type="text/javascript" src="../src/dl_select.js"></script>
        <link href="./default.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css?family=Rubik:300,500" rel="stylesheet">

        <style>
            body {
                padding: 0px;
                margin: 0px;
            }

            .dl-modal  {
                position: absolute;
                display: block;
                margin: 0px;
                padding: 0px;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.1);
            }

            .dl-modal .modal {
                display: block;
                padding: 50px 50px 10px 50px;
                width: 500px;
                margin: 0px auto;
                margin-top: 50px;
                border-radius: 4px;
                background-color: #fff;
                box-shadow: 0px 0px 23px -2px rgba(0,0,0,0.06);
            }

            .dl-modal .low-bar {
                margin: 0px;
                margin: 0px -50px -10px -50px;
                height: 45px;
                background-color: #f8f8f8;
                border-bottom-left-radius: 4px;
                border-bottom-right-radius: 4px;
            }

            .dl-modal .btn {
                float: right;
                padding: 5px 10px 5px 10px;
                margin-top: 7px;
                margin-right: 7px;
                border: 2px solid #1ea6a3;
                border-radius: 4px;
                font-family: Rubik;
                color: #1ea6a3;
                background-color: transparent;
                cursor: pointer;
            }

            .dl-modal .btn:hover {
                border: 2px solid #22bb8b;
                box-shadow: 0px 0px 19px -1px rgba(34,187,139,0.1);
            }

            .dl-form {
                font-family: Rubik;
                width: 500px;
            }

            .dl-form label {
                display: block;
                margin-bottom: 7px;
                margin-left: 2px;
                font-size: 0.9em;
                color: #58565c;
                font-weight: #500;
            }

        </style>
    </head>

    <body>

    </body>

    <script>

        var form;

        document.addEventListener("DOMContentLoaded", function(event) {
            var DeclarativForm = require('/src/declarativ_form.js')

            var container = document.getElementById('form-container')

            attr = {
                fields: [
                    {
                      name: 'language',
                      displayName: 'Syntax Highlighting for',
                      allowedValues: ["XML", "HTML", "MathML", "SVG", "CSS", "clike", "JavaScript"],
                      defaultValue: 'JavaScript'
                    }
                ]
            }

            form = new DeclarativForm(attr)
            form.openInModal()
        });

    </script>
</html>
